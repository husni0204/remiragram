name: Build Android (Play Store)

on:
  # Trigger manual via GitHub UI (Actions tab) HANYA, sampai setup EAS selesai
  # Ganti kembali ke push: setelah EXPO_TOKEN + EXPO_PROJECT_ID di-set di secrets
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - 'android'

jobs:
  build-android:
    name: Build APK & AAB for Play Store
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Remove package-lock.json (avoid mixed lock files)
        run: rm -f package-lock.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure Gradle signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          mkdir -p android/app/src/main/assets
          echo "$KEYSTORE" | base64 -d > android/app/release.keystore
          cat >> android/key.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release.keystore
          EOF
        working-directory: android

      - name: Build Android AAB
        run: eas build --platform ${{ inputs.platform || 'android' }} --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: artifacts/**/*.aab
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/**/*.apk
          retention-days: 14
