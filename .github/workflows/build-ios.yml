name: Build iOS (TestFlight)

on:
  # Trigger manual via GitHub UI (Actions tab) HANYA, sampai setup EAS selesai
  # Ganti kembali ke push: setelah EXPO_TOKEN + EXPO_PROJECT_ID di-set di secrets
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options:
          - 'ios'

jobs:
  build-ios:
    name: Build IPA for TestFlight
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Remove package-lock.json (avoid mixed lock files)
        run: rm -f package-lock.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA
        run: eas build --platform ${{ inputs.platform || 'ios' }} --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/**/*.ipa
          retention-days: 14

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: ios-metadata
          path: artifacts/**/*metadata*
          retention-days: 14
